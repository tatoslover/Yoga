<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Mat & Mind Yoga</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8f8f8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            font-weight: 600;
            font-size: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .offline-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            color: #666;
        }

        .message {
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            background: #6b46c1;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .button:hover {
            background: #553c9a;
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            background: #fff;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Mat & Mind Yoga</div>
    </header>

    <main class="container">
        <div class="offline-icon">⚠️</div>
        <h1>You're Offline</h1>
        <div class="message">
            <p>It looks like you're not connected to the internet right now.</p>
            <p>Some previously viewed content might be available in your cache.</p>
        </div>
        <a href="/" class="button">Try Again</a>
    </main>

    <footer>
        <p>&copy; 2023 Mat & Mind Yoga. All rights reserved.</p>
    </footer>
</body>
</html>
